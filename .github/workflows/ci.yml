name: CI frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch solo en src/api.js
        run: |
          if [ -d src ] && grep -rn "fetch(" src --include=*.js --include=*.jsx | grep -v "src/api.js"; then
            echo "Hay fetch fuera de src/api.js"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas con cobertura y build
        run: |
          if [ ! -f package.json ]; then
            echo "Todavía no hay código del frontend; no hay pruebas que correr."
            exit 0
          fi
          npm ci
          npm test -- --run --coverage
          npm run build
