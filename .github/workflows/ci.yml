name: CI frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas, cobertura (mínimo 80 %) y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch solo en src/api.js
        run: |
          if grep -rn "fetch(" src --include=*.js --include=*.jsx | grep -v "src/api.js" | grep -v ".test.jsx"; then
            echo "Hay fetch fuera de src/api.js"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pruebas con cobertura
        run: |
          if ! ls src/**/*.test.jsx src/*.test.jsx >/dev/null 2>&1; then
            echo "Todavía no hay pruebas."; exit 0
          fi
          npm test -- --run --coverage
      - run: npm run build
